apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: |-
      [
        {
          "apiVersion": "networking.openshift.io/v1alpha1",
          "kind": "CUDNBgpConfig",
          "metadata": {
            "name": "cluster"
          },
          "spec": {
            "aws": {
              "region": "us-east-1",
              "routeServerIDs": [
                "rs-0abc123456789abcd"
              ]
            },
            "bgp": {
              "livenessDetection": "bgp-keepalive",
              "localASN": 65001
            },
            "routerNodeSelector": {
              "bgp_router": "true"
            }
          }
        },
        {
          "apiVersion": "networking.openshift.io/v1alpha1",
          "kind": "CUDNBgpRouting",
          "metadata": {
            "name": "cudn1"
          },
          "spec": {
            "network": {
              "name": "prod",
              "subnets": [
                "10.100.0.0/16"
              ]
            }
          }
        }
      ]
    capabilities: Basic Install
    categories: Networking
    containerImage: controller:latest
    createdAt: "2026-08-06T16:50:13Z"
    description: Automates L3 direct routing between CUDN Pod networks and external
      networks via BGP on OpenShift. Cloud platform aware — auto-discovers BGP infrastructure
      on AWS (VPC Route Server) and works on-premise with explicit configuration.
    operatorframework.io/suggested-namespace: openshift-cudn-bgp-routing
    operators.operatorframework.io/builder: operator-sdk-v1.42.2
    operators.operatorframework.io/project_layout: go.kubebuilder.io/v4
  name: openshift-cudn-bgp-routing.v0.1.0
  namespace: placeholder
spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
    - description: CUDNBgpConfig is the singleton cluster-scoped BGP infrastructure
        configuration.
      displayName: CUDNBgp Config
      kind: CUDNBgpConfig
      name: cudnbgpconfigs.networking.openshift.io
      version: v1alpha1
    - description: |-
        CUDNBgpRouting declares a single CUDN network to advertise via BGP.
        Users must pre-create and label namespaces; the operator manages only the CUDN and RouteAdvertisements.
      displayName: CUDNBgp Routing
      kind: CUDNBgpRouting
      name: cudnbgproutings.networking.openshift.io
      version: v1alpha1
  description: |
    CUDN BGP Routing Operator automates L3 direct routing between
    Cluster User Defined Networks (CUDN) and external networks via BGP
    on OpenShift. Core BGP and CUDN functionality works on any OpenShift
    cluster with external BGP servers. When platform configuration is
    provided (e.g. AWS), the operator auto-discovers cloud BGP
    infrastructure and manages cloud-side networking resources. It
    replaces manual in-cluster configuration steps by reconciling
    FRRConfiguration, ClusterUserDefinedNetwork, and
    RouteAdvertisements resources from two simple CRs.
  displayName: CUDN BGP Routing Operator
  icon:
  - base64data: ""
    mediatype: image/png
  install:
    spec:
      clusterPermissions:
      - rules:
        - apiGroups:
          - ""
          resources:
          - namespaces
          - nodes
          - pods
          verbs:
          - get
          - list
          - watch
        - apiGroups:
          - config.openshift.io
          resources:
          - infrastructures
          verbs:
          - get
        - apiGroups:
          - frrk8s.metallb.io
          resources:
          - frrconfigurations
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - k8s.ovn.org
          resources:
          - clusteruserdefinednetworks
          - routeadvertisements
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - networking.openshift.io
          resources:
          - cudnbgpconfigs
          - cudnbgproutings
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - networking.openshift.io
          resources:
          - cudnbgpconfigs/finalizers
          - cudnbgproutings/finalizers
          verbs:
          - update
        - apiGroups:
          - networking.openshift.io
          resources:
          - cudnbgpconfigs/status
          - cudnbgproutings/status
          verbs:
          - get
          - patch
          - update
        - apiGroups:
          - operator.openshift.io
          resources:
          - networks
          verbs:
          - get
          - list
          - patch
          - watch
        - apiGroups:
          - authentication.k8s.io
          resources:
          - tokenreviews
          verbs:
          - create
        - apiGroups:
          - authorization.k8s.io
          resources:
          - subjectaccessreviews
          verbs:
          - create
        serviceAccountName: openshift-cudn-bgp-routing-controller-manager
      deployments:
      - label:
          app.kubernetes.io/managed-by: kustomize
          app.kubernetes.io/name: openshift-cudn-bgp-routing
          control-plane: controller-manager
        name: openshift-cudn-bgp-routing-controller-manager
        spec:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/name: openshift-cudn-bgp-routing
              control-plane: controller-manager
          strategy: {}
          template:
            metadata:
              annotations:
                kubectl.kubernetes.io/default-container: manager
              labels:
                app.kubernetes.io/name: openshift-cudn-bgp-routing
                control-plane: controller-manager
            spec:
              containers:
              - args:
                - --metrics-bind-address=:8443
                - --leader-elect
                - --health-probe-bind-address=:8081
                command:
                - /manager
                image: controller:latest
                livenessProbe:
                  httpGet:
                    path: /healthz
                    port: 8081
                  initialDelaySeconds: 15
                  periodSeconds: 20
                name: manager
                readinessProbe:
                  httpGet:
                    path: /readyz
                    port: 8081
                  initialDelaySeconds: 5
                  periodSeconds: 10
                resources:
                  limits:
                    cpu: 500m
                    memory: 128Mi
                  requests:
                    cpu: 10m
                    memory: 64Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
              securityContext:
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              serviceAccountName: openshift-cudn-bgp-routing-controller-manager
              terminationGracePeriodSeconds: 10
      permissions:
      - rules:
        - apiGroups:
          - ""
          resources:
          - configmaps
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        - apiGroups:
          - coordination.k8s.io
          resources:
          - leases
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        - apiGroups:
          - ""
          resources:
          - events
          verbs:
          - create
          - patch
        serviceAccountName: openshift-cudn-bgp-routing-controller-manager
    strategy: deployment
  installModes:
  - supported: true
    type: OwnNamespace
  - supported: true
    type: SingleNamespace
  - supported: false
    type: MultiNamespace
  - supported: false
    type: AllNamespaces
  maturity: alpha
  minKubeVersion: 1.31.0
  provider:
    name: Red Hat
  version: 0.1.0
