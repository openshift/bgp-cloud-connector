apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: |-
      [
        {
          "apiVersion": "networking.openshift.io/v1beta1",
          "kind": "BGPCloudConfiguration",
          "metadata": {
            "name": "cluster"
          },
          "spec": {
            "aws": {
              "region": "us-east-1",
              "routeServerIDs": [
                "rs-0abc123456789abcd"
              ]
            },
            "bgp": {
              "livenessDetection": "bgp-keepalive",
              "localASN": 65001
            },
            "platform": "AWS",
            "routerNodeSelector": {
              "bgp_router": "true"
            }
          }
        },
        {
          "apiVersion": "networking.openshift.io/v1beta1",
          "kind": "BGPRouting",
          "metadata": {
            "name": "cudn1"
          },
          "spec": {
            "network": {
              "name": "prod",
              "subnets": [
                "10.100.0.0/16"
              ]
            }
          }
        }
      ]
    capabilities: Basic Install
    categories: Networking
    containerImage: controller:latest
    createdAt: "2026-09-03T12:48:56Z"
    description: Automates L3 direct routing between CUDN Pod networks and external
      networks via BGP on OpenShift. Cloud platform aware — auto-discovers BGP infrastructure
      on AWS (VPC Route Server) and works on-premise with explicit configuration.
    features.operators.openshift.io/disconnected: "true"
    features.operators.openshift.io/fips-compliant: "false"
    features.operators.openshift.io/proxy-aware: "false"
    features.operators.openshift.io/tls-profiles: "false"
    features.operators.openshift.io/token-auth-aws: "true"
    features.operators.openshift.io/token-auth-azure: "false"
    features.operators.openshift.io/token-auth-gcp: "false"
    operatorframework.io/suggested-namespace: bgp-cloud-connector
    operators.openshift.io/valid-subscription: '["OpenShift Kubernetes Engine", "OpenShift
      Container Platform", "OpenShift Platform Plus"]'
    operators.operatorframework.io/builder: operator-sdk-v1.42.2
    operators.operatorframework.io/project_layout: go.kubebuilder.io/v4
  name: bgp-cloud-connector.v0.0.1
  namespace: placeholder
spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
    - description: BGPCloudConfiguration is the singleton cluster-scoped BGP infrastructure
        configuration.
      displayName: BGP Cloud Configuration
      kind: BGPCloudConfiguration
      name: bgpcloudconfigurations.networking.openshift.io
      version: v1beta1
    - description: |-
        BGPRouting declares a single network to advertise via BGP.
        Users must pre-create and label namespaces; the operator manages only the
        ClusterUserDefinedNetwork and RouteAdvertisements.
      displayName: BGP Routing
      kind: BGPRouting
      name: bgproutings.networking.openshift.io
      version: v1beta1
  description: |
    **Important:** This is a preview release for internal testing purposes only.
    It is not supported by Red Hat and is not intended for production use by customers.

    BGP cloud connector automates L3 direct routing between
    Cluster User Defined Networks (CUDN) and external networks via BGP
    on OpenShift. Core BGP and CUDN functionality works on any OpenShift
    cluster with external BGP servers. When platform configuration is
    provided (e.g. AWS), the operator auto-discovers cloud BGP
    infrastructure and manages cloud-side networking resources. It
    replaces manual in-cluster configuration steps by reconciling
    FRRConfiguration, ClusterUserDefinedNetwork, and
    RouteAdvertisements resources from two simple CRs.
  displayName: BGP cloud connector
  icon:
  - base64data: ""
    mediatype: image/png
  install:
    spec:
      clusterPermissions:
      - rules:
        - apiGroups:
          - ""
          resources:
          - namespaces
          - nodes
          - pods
          verbs:
          - get
          - list
          - watch
        - apiGroups:
          - cloudcredential.openshift.io
          resources:
          - credentialsrequests
          verbs:
          - create
          - get
          - list
          - update
          - watch
        - apiGroups:
          - config.openshift.io
          resources:
          - infrastructures
          verbs:
          - get
        - apiGroups:
          - frrk8s.metallb.io
          resources:
          - frrconfigurations
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - k8s.ovn.org
          resources:
          - clusteruserdefinednetworks
          - routeadvertisements
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - networking.k8s.io
          resources:
          - networkpolicies
          verbs:
          - create
          - delete
          - patch
          - update
        - apiGroups:
          - networking.openshift.io
          resources:
          - bgpcloudconfigurations
          - bgproutings
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - networking.openshift.io
          resources:
          - bgpcloudconfigurations/finalizers
          - bgproutings/finalizers
          verbs:
          - update
        - apiGroups:
          - networking.openshift.io
          resources:
          - bgpcloudconfigurations/status
          - bgproutings/status
          verbs:
          - get
          - patch
          - update
        - apiGroups:
          - operator.openshift.io
          resources:
          - networks
          verbs:
          - get
          - list
          - patch
          - watch
        - apiGroups:
          - authentication.k8s.io
          resources:
          - tokenreviews
          verbs:
          - create
        - apiGroups:
          - authorization.k8s.io
          resources:
          - subjectaccessreviews
          verbs:
          - create
        serviceAccountName: openshift-bgp-cloud-connector-controller-manager
      deployments:
      - label:
          app.kubernetes.io/managed-by: kustomize
          app.kubernetes.io/name: openshift-bgp-cloud-connector
          control-plane: controller-manager
        name: openshift-bgp-cloud-connector-controller-manager
        spec:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/name: openshift-bgp-cloud-connector
              control-plane: controller-manager
          strategy: {}
          template:
            metadata:
              annotations:
                kubectl.kubernetes.io/default-container: manager
              labels:
                app.kubernetes.io/name: openshift-bgp-cloud-connector
                control-plane: controller-manager
            spec:
              containers:
              - args:
                - --metrics-bind-address=:8443
                - --leader-elect
                - --health-probe-bind-address=:8081
                - --metrics-cert-path=/var/run/secrets/serving-cert
                command:
                - /manager
                env:
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                image: controller:latest
                livenessProbe:
                  httpGet:
                    path: /healthz
                    port: 8081
                  initialDelaySeconds: 15
                  periodSeconds: 20
                name: manager
                readinessProbe:
                  httpGet:
                    path: /readyz
                    port: 8081
                  initialDelaySeconds: 5
                  periodSeconds: 10
                resources:
                  limits:
                    cpu: 500m
                    memory: 128Mi
                  requests:
                    cpu: 10m
                    memory: 64Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
                  readOnlyRootFilesystem: true
                volumeMounts:
                - mountPath: /var/run/secrets/openshift/serviceaccount
                  name: bound-sa-token
                  readOnly: true
                - mountPath: /tmp
                  name: tmp
                - mountPath: /var/run/secrets/serving-cert
                  name: metrics-cert
                  readOnly: true
              securityContext:
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              serviceAccountName: openshift-bgp-cloud-connector-controller-manager
              terminationGracePeriodSeconds: 10
              volumes:
              - emptyDir: {}
                name: tmp
              - name: bound-sa-token
                projected:
                  sources:
                  - serviceAccountToken:
                      audience: openshift
                      path: token
              - name: metrics-cert
                secret:
                  defaultMode: 420
                  secretName: bgp-cloud-connector-metrics-tls
      permissions:
      - rules:
        - apiGroups:
          - ""
          resources:
          - configmaps
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        - apiGroups:
          - coordination.k8s.io
          resources:
          - leases
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        - apiGroups:
          - ""
          resources:
          - events
          verbs:
          - create
          - patch
        - apiGroups:
          - ""
          resourceNames:
          - bgp-cloud-connector-aws-credentials
          resources:
          - secrets
          verbs:
          - get
        serviceAccountName: openshift-bgp-cloud-connector-controller-manager
    strategy: deployment
  installModes:
  - supported: true
    type: OwnNamespace
  - supported: true
    type: SingleNamespace
  - supported: false
    type: MultiNamespace
  - supported: false
    type: AllNamespaces
  maturity: alpha
  minKubeVersion: 1.31.0
  provider:
    name: Red Hat
  version: 0.0.1
