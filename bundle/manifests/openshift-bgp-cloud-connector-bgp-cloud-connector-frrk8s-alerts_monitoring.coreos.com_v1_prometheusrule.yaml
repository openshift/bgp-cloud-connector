apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: openshift-bgp-cloud-connector
  name: openshift-bgp-cloud-connector-bgp-cloud-connector-frrk8s-alerts
spec:
  groups:
  - name: BGPSessionHealth
    rules:
    - alert: BGPSessionDown
      annotations:
        description: BGP session to peer {{ $labels.peer }} (VRF {{ $labels.vrf }})
          has been down for more than 1 minute.
        netobserv_io_network_health: '{}'
        summary: BGP session is down
      expr: frrk8s_bgp_session_up == 0
      for: 1m
      labels:
        netobserv: "true"
        severity: critical
    - alert: BGPPeerFlapping
      annotations:
        description: 'BGP session to peer {{ $labels.peer }} is flapping: more than
          3 opens sent in the last 10 minutes.'
        netobserv_io_network_health: '{}'
        summary: BGP peer is flapping
      expr: increase(frrk8s_bgp_opens_sent[10m]) > 3
      for: 5m
      labels:
        netobserv: "true"
        severity: warning
    - alert: BGPNoPrefixesReceived
      annotations:
        description: BGP session to peer {{ $labels.peer }} has 0 received prefixes
          for more than 5 minutes. Routes may not be imported.
        netobserv_io_network_health: '{}'
        summary: BGP session has no received prefixes
      expr: frrk8s_bgp_received_prefixes_total == 0 and frrk8s_bgp_session_up == 1
      for: 5m
      labels:
        netobserv: "true"
        severity: warning
    - alert: BGPNoPrefixesAnnounced
      annotations:
        description: BGP session to peer {{ $labels.peer }} has 0 announced prefixes
          for more than 5 minutes. Pod subnets may not be reachable externally.
        netobserv_io_network_health: '{}'
        summary: BGP session has no announced prefixes
      expr: frrk8s_bgp_announced_prefixes_total == 0 and frrk8s_bgp_session_up ==
        1
      for: 5m
      labels:
        netobserv: "true"
        severity: warning
  - name: BFDSessionHealth
    rules:
    - alert: BFDSessionDown
      annotations:
        description: BFD session to peer {{ $labels.peer }} (VRF {{ $labels.vrf }})
          has been down for more than 30 seconds. Fast failover is impaired.
        netobserv_io_network_health: '{}'
        summary: BFD session is down
      expr: frrk8s_bfd_session_up == 0
      for: 30s
      labels:
        netobserv: "true"
        severity: critical
    - alert: BFDPeerFlapping
      annotations:
        description: 'BFD session to peer {{ $labels.peer }} is flapping: more than
          3 down events in the last 10 minutes.'
        netobserv_io_network_health: '{}'
        summary: BFD session is flapping
      expr: increase(frrk8s_bfd_session_down_events[10m]) > 3
      for: 5m
      labels:
        netobserv: "true"
        severity: warning
