apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  creationTimestamp: null
  name: cudnbgpconfigs.networking.openshift.io
spec:
  group: networking.openshift.io
  names:
    kind: CUDNBgpConfig
    listKind: CUDNBgpConfigList
    plural: cudnbgpconfigs
    singular: cudnbgpconfig
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: CUDNBgpConfig is the singleton cluster-scoped BGP infrastructure
          configuration.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              The cloud block and the platform have to agree in both directions: naming a
              platform without its block leaves the operator nothing to work from, and a
              block without its platform is configuration that will never be read. Saying
              it in CEL means the API server refuses it, rather than the operator
              discovering it at reconcile and reporting Degraded.

              peerGroups is the counterpart for Manual, which has no cloud to discover
              from and so must declare its neighbours, and must not declare them on any
              other platform, where they would silently lose to what was discovered.
            properties:
              aws:
                description: |-
                  AWSConfig names the VPC Route Servers to discover. A VPC can hold several
                  and their endpoints are per subnet, which is why AWS is the cloud that
                  produces more than one peer group.
                properties:
                  region:
                    type: string
                  routeServerIDs:
                    items:
                      type: string
                    minItems: 1
                    type: array
                required:
                - region
                - routeServerIDs
                type: object
              bgp:
                properties:
                  livenessDetection:
                    default: bgp-keepalive
                    enum:
                    - bfd
                    - bgp-keepalive
                    type: string
                  localASN:
                    format: int64
                    maximum: 4294967295
                    minimum: 0
                    type: integer
                  peerGroups:
                    items:
                      description: |-
                        PeerGroup is a set of router nodes sharing a neighbour set, and becomes one
                        FRRConfiguration.

                        How many groups a cluster has is a property of its cloud. Endpoints that are
                        per subnet give one group per availability zone, because a node peers with
                        the ones in its own; endpoints presented once for a region give a single
                        group covering every router node.
                      properties:
                        neighbors:
                          items:
                            properties:
                              address:
                                type: string
                              remoteASN:
                                format: int64
                                maximum: 4294967295
                                minimum: 0
                                type: integer
                            required:
                            - address
                            - remoteASN
                            type: object
                          minItems: 1
                          type: array
                        nodeSelector:
                          additionalProperties:
                            type: string
                          type: object
                      required:
                      - neighbors
                      - nodeSelector
                      type: object
                    type: array
                required:
                - localASN
                type: object
              platform:
                description: |-
                  PlatformType selects which cloud the operator reconciles BGP peering
                  against. It is the discriminator for the cloud-specific block in the spec.
                enum:
                - AWS
                - Manual
                type: string
              routerNodeSelector:
                additionalProperties:
                  type: string
                type: object
            required:
            - bgp
            - platform
            - routerNodeSelector
            type: object
            x-kubernetes-validations:
            - message: spec.aws must be set when spec.platform is AWS, and must be
                absent otherwise
              rule: (self.platform == 'AWS') == has(self.aws)
            - message: spec.bgp.peerGroups is required when spec.platform is Manual
              rule: self.platform != 'Manual' || (has(self.bgp.peerGroups) && size(self.bgp.peerGroups)
                > 0)
            - message: spec.bgp.peerGroups may only be set when spec.platform is Manual
              rule: self.platform == 'Manual' || !has(self.bgp.peerGroups) || size(self.bgp.peerGroups)
                == 0
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              frrProviderOwned:
                description: FRRProviderOwned is true when this controller added
                  FRR to Network/cluster additionalRoutingCapabilities.providers.
                type: boolean
              routeAdsOwned:
                description: RouteAdsOwned is true when this controller set routeAdvertisements
                  to Enabled on Network/cluster.
                type: boolean
              observedGeneration:
                format: int64
                type: integer
              peerGroups:
                description: |-
                  PeerGroups is the discovered peering plan: what the operator found in
                  the cloud and rendered into FRRConfigurations. Empty under
                  platform: Manual, where the plan is declared in spec.bgp.peerGroups
                  rather than discovered.
                items:
                  description: |-
                    PeerGroupStatus reports one group of the peering plan the operator
                    discovered, and therefore what FRR was configured to peer with.

                    Every cloud populates it, which is the bar a shared status block has to
                    clear: one shaped around a single provider's resources leaves every other
                    cloud reconciling peerings and reporting nothing about them, and a sibling
                    block per cloud is worse.
                  properties:
                    key:
                      description: |-
                        Key names the group in cloud-meaningful terms: an availability zone on
                        AWS, and whatever names the single regional endpoint elsewhere.
                      type: string
                    neighbors:
                      description: Neighbors are the addresses the router nodes in
                        this group peer with.
                      items:
                        properties:
                          address:
                            type: string
                          remoteASN:
                            format: int64
                            maximum: 4294967295
                            minimum: 0
                            type: integer
                        required:
                        - address
                        - remoteASN
                        type: object
                      type: array
                    nodeSelector:
                      additionalProperties:
                        type: string
                      description: |-
                        NodeSelector narrows spec.routerNodeSelector to this group. Empty means
                        every router node.
                      type: object
                  required:
                  - key
                  type: object
                type: array
              phase:
                enum:
                - Pending
                - Configuring
                - Ready
                - Degraded
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
status:
  acceptedNames:
    kind: ""
    plural: ""
  conditions: null
  storedVersions: null
