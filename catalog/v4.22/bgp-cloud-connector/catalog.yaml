- type: olm.csv.metadata
  value:
    annotations:
      alm-examples: |-
        [
          {
            "apiVersion": "networking.openshift.io/v1alpha1",
            "kind": "CUDNBgpConfig",
            "metadata": {
              "name": "cluster"
            },
            "spec": {
              "aws": {
                "region": "us-east-1",
                "routeServerIDs": [
                  "rs-0abc123456789abcd"
                ]
              },
              "bgp": {
                "livenessDetection": "bgp-keepalive",
                "localASN": 65001
              },
              "routerNodeSelector": {
                "bgp_router": "true"
              }
            }
          },
          {
            "apiVersion": "networking.openshift.io/v1alpha1",
            "kind": "CUDNBgpRouting",
            "metadata": {
              "name": "cudn1"
            },
            "spec": {
              "network": {
                "name": "prod",
                "subnets": [
                  "10.100.0.0/16"
                ]
              }
            }
          }
        ]
      capabilities: Basic Install
      categories: Networking
      containerImage: registry.redhat.io/bgpcc/bgp-cloud-connector-rhel9-operator@sha256:ef7f705fcdf1a6a19f09835c39122ed743d6453966fe8a964b3cca250cb3a315
      createdAt: "2026-08-17T21:27:25Z"
      description: Automates L3 direct routing between CUDN Pod networks and external
        networks via BGP on OpenShift. Cloud platform aware — auto-discovers BGP infrastructure
        on AWS (VPC Route Server) and works on-premise with explicit configuration.
      features.operators.openshift.io/disconnected: "false"
      features.operators.openshift.io/fips-compliant: "false"
      features.operators.openshift.io/proxy-aware: "false"
      features.operators.openshift.io/tls-profiles: "false"
      features.operators.openshift.io/token-auth-aws: "false"
      features.operators.openshift.io/token-auth-azure: "false"
      features.operators.openshift.io/token-auth-gcp: "false"
      operatorframework.io/suggested-namespace: openshift-cudn-bgp-routing
      operators.openshift.io/valid-subscription: '["OpenShift Kubernetes Engine",
