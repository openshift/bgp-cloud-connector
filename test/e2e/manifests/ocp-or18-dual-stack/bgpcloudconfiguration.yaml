apiVersion: networking.openshift.io/v1beta1
kind: BGPCloudConfiguration
metadata:
  name: cluster
spec:
  platform: Manual
  bgp:
    localASN: 64502
    livenessDetection: bfd
    peerGroups:
      - neighbors:
          - address: 100.72.142.4
            remoteASN: 64501
          - address: 2a00:8a00:4000:780::4
            remoteASN: 64501
        nodeSelector: {}

  routerNodeSelector:
    bgp_router: "true"
