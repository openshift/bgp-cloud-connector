# Binds the namespaced half of manager-role, which is the operator's own
# credentials secret and nothing else. The cluster-scoped half is bound by
# role_binding.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/name: openshift-bgp-cloud-connector
    app.kubernetes.io/managed-by: kustomize
  name: manager-namespaced-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: manager-role
subjects:
- kind: ServiceAccount
  name: controller-manager
  namespace: system
