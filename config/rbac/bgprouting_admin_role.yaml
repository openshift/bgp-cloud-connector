# This rule is not used by the project bgp-cloud-connector itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over networking.openshift.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: bgp-cloud-connector
    app.kubernetes.io/managed-by: kustomize
  name: bgprouting-admin-role
rules:
- apiGroups:
  - networking.openshift.io
  resources:
  - bgproutings
  verbs:
  - '*'
- apiGroups:
  - networking.openshift.io
  resources:
  - bgproutings/status
  verbs:
  - get
