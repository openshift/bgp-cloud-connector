  resources:
  - bgpcloudconfigurations
  - bgproutings
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - networking.openshift.io
  resources:
  - bgpcloudconfigurations/finalizers
  - bgproutings/finalizers
  verbs:
  - update
- apiGroups:
  - networking.openshift.io
  resources:
  - bgpcloudconfigurations/status
  - bgproutings/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - operator.openshift.io
  resources:
  - networks
  verbs:
  - get
  - list
  - patch
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: manager-role
  namespace: openshift-bgp-cloud-connector
rules:
- apiGroups:
  - ""
  resourceNames:
  - bgp-cloud-connector-aws-credentials
  resources:
  - secrets
  verbs:
  - get
