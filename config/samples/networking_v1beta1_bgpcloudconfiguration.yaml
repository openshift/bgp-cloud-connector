  #     - nodeSelector:
  #         topology.kubernetes.io/zone: us-east-1a
  #         bgp_router_subnet: "1"
  #       neighbors:
  #         - address: 10.0.1.47
  #           remoteASN: 64512
  #         - address: 10.0.1.183
  #           remoteASN: 64512
  #     - nodeSelector:
  #         topology.kubernetes.io/zone: us-east-1b
  #         bgp_router_subnet: "2"
  #       neighbors:
  #         - address: 10.0.2.91
  #           remoteASN: 64512
  #         - address: 10.0.2.204
  #           remoteASN: 64512
