# Prometheus Monitor Service (Metrics)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: openshift-bgp-cloud-connector
    app.kubernetes.io/managed-by: kustomize
  name: controller-manager-metrics-monitor
  namespace: system
spec:
  endpoints:
    - path: /metrics
      port: https # Ensure this is the name of the port that exposes HTTPS metrics
      scheme: https
      # The platform Prometheus (prometheus-k8s) presents its own service account
      # token, which the operator's metrics FilterProvider validates via
      # TokenReview/SubjectAccessReview against the 'metrics-reader' ClusterRole.
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        # The serving certificate is minted by the OpenShift service-ca operator;
        # verify it against the service-ca bundle that platform Prometheus mounts.
        caFile: /etc/prometheus/configmaps/serving-certs-ca-bundle/service-ca.crt
        serverName: openshift-bgp-cloud-connector-controller-manager-metrics-service.openshift-bgp-cloud-connector.svc
  namespaceSelector:
    matchNames:
      - openshift-bgp-cloud-connector
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: openshift-bgp-cloud-connector
